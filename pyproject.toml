[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urban-assault-level-generator"
version = "0.1.0"
description = "Python reimplementation of selected Urban Assault level generators."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Ydro" }]
dependencies = []

[project.scripts]
ualg = "ualg.cli:main"
ualg-gui = "ualg.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ualg"]

[tool.hatch.build.targets.wheel.force-include]
"src/ualg/data" = "ualg/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
